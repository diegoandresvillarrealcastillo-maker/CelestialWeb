services:
  - type: web
    name: celestialweb-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
      - key: IP_HASH_SECRET
        sync: false
      - key: ORDER_TOKEN_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: HEALTHCHECK_SECRET
        sync: false
      - key: EMAIL_PROVIDER_URL
        sync: false
      - key: EMAIL_PROVIDER_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EXPECTED_ADMIN_COUNT
        value: "2"
